<script>
(function(){
  var imgs=[].slice.call(document.querySelectorAll('#main img'));
  var cur=document.getElementById('cur'), tip=document.getElementById('tip'), mask=null;
  function sync(){
    var mid=window.innerHeight*0.4, n=1;
    for(var i=0;i<imgs.length;i++){ if(imgs[i].getBoundingClientRect().top<=mid) n=i+1; }
    cur.textContent=n;
  }
  imgs.forEach(function(im){
    im.addEventListener('click',function(){
      if(im.classList.contains('zoom')){ im.classList.remove('zoom'); if(mask){mask.remove();mask=null;} return; }
      mask=document.createElement('div'); mask.className='mask'; document.body.appendChild(mask);
      im.classList.add('zoom');
      mask.addEventListener('click',function(){ im.classList.remove('zoom'); mask.remove(); mask=null; });
    });
  });
  window.addEventListener('scroll',sync,{passive:true});
  sync();
  var t=null;
  window.addEventListener('scroll',function(){ tip.style.opacity=1; clearTimeout(t); t=setTimeout(function(){ tip.style.transition='opacity .6s'; tip.style.opacity=.55; },1800); },{passive:true});
})();
</script>
